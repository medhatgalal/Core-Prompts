<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Start with intent, then choose the next skill</title><desc id="desc">Six common user intents map to their existing Core-Prompts skill owners. Accepted artifacts, actual availability and permissions still govern the next action.</desc><rect width="1200" height="590" rx="14" fill="#171918"/><g font-family="system-ui,sans-serif"><text x="24" y="40" fill="#b8efbd" font-size="24">Describe the job. Your assistant recommends the first missing step.</text><text x="24" y="68" fill="#a7b1a9" font-size="16">Skip completed work. Full Shape Up keeps its conductor and human decisions.</text><rect x="24" y="92" width="400" height="60" rx="10" fill="#25392b" stroke="#7aa981"/><text x="42" y="126" fill="#f0f2ed" font-size="18">I have a rough problem</text><path d="M435 122h38m-8-8 8 8-8 8" stroke="#b8efbd" fill="none"/><rect x="488" y="92" width="680" height="60" rx="10" fill="#202321" stroke="#49534c"/><text x="508" y="126" fill="#f0f2ed" font-size="17">engos-design-frame-from-vague</text><rect x="24" y="167" width="400" height="60" rx="10" fill="#25392b" stroke="#7aa981"/><text x="42" y="201" fill="#f0f2ed" font-size="18">I need to choose between proposals</text><path d="M435 197h38m-8-8 8 8-8 8" stroke="#b8efbd" fill="none"/><rect x="488" y="167" width="680" height="60" rx="10" fill="#202321" stroke="#49534c"/><text x="508" y="201" fill="#f0f2ed" font-size="17">engos-reconciliation-converge</text><rect x="24" y="242" width="400" height="60" rx="10" fill="#25392b" stroke="#7aa981"/><text x="42" y="276" fill="#f0f2ed" font-size="18">I want a full Shape Up workshop</text><path d="M435 272h38m-8-8 8 8-8 8" stroke="#b8efbd" fill="none"/><rect x="488" y="242" width="680" height="60" rx="10" fill="#202321" stroke="#49534c"/><text x="508" y="276" fill="#f0f2ed" font-size="17">engos-design-shaping</text><rect x="24" y="317" width="400" height="60" rx="10" fill="#25392b" stroke="#7aa981"/><text x="42" y="351" fill="#f0f2ed" font-size="18">I have a small, clear change</text><path d="M435 347h38m-8-8 8 8-8 8" stroke="#b8efbd" fill="none"/><rect x="488" y="317" width="680" height="60" rx="10" fill="#202321" stroke="#49534c"/><text x="508" y="351" fill="#f0f2ed" font-size="17">engos-delivery-implement-slice</text><rect x="24" y="392" width="400" height="60" rx="10" fill="#25392b" stroke="#7aa981"/><text x="42" y="426" fill="#f0f2ed" font-size="18">Something fails and I do not know why</text><path d="M435 422h38m-8-8 8 8-8 8" stroke="#b8efbd" fill="none"/><rect x="488" y="392" width="680" height="60" rx="10" fill="#202321" stroke="#49534c"/><text x="508" y="426" fill="#f0f2ed" font-size="17">engos-debug-diagnose-failure</text><rect x="24" y="467" width="400" height="60" rx="10" fill="#25392b" stroke="#7aa981"/><text x="42" y="501" fill="#f0f2ed" font-size="18">I know the feature, but not acceptance</text><path d="M435 497h38m-8-8 8 8-8 8" stroke="#b8efbd" fill="none"/><rect x="488" y="467" width="680" height="60" rx="10" fill="#202321" stroke="#49534c"/><text x="508" y="501" fill="#f0f2ed" font-size="17">engos-design-specify-change</text></g></svg>
