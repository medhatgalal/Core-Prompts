workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - validate

validate_cli_surfaces:
  stage: validate
  image: python:3.14
  script:
    - python3 scripts/sync-surface-specs.py --refresh
    - python3 -m pip install 'pytest>=8,<10' 'jsonschema>=4,<5' 'cryptography>=43'
    - python3 -m pytest -q tests/test_capability_resources.py tests/test_resource_delivery.py tests/test_frontier_eval_integration.py tests/test_uac_semantic_uplift.py tests/test_uac_quality.py tests/test_uac_source_integrity.py tests/test_uac_promotion_apply.py tests/test_supercharge_preservation.py tests/test_supercharge_debate.py tests/test_frontier_skill_contracts.py
    - python3 -m pytest -q tests/test_uac_import.py -k bootstrap
    - python3 scripts/smoke-clis.py
    - bin/capability-eval compile --all --check
    - bin/capability-eval calibrate --static-only
    - python3 scripts/validate-surfaces.py --strict
    - bin/capability-fabric build
    - python3 -m pytest -q tests/test_package_surfaces.py tests/test_package_local_config.py tests/test_deploy_profile.py tests/test_update_core_prompts.py
