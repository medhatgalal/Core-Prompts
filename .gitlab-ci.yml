workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - validate

validate_cli_surfaces:
  stage: validate
  image: python:3.14
  variables:
    GIT_DEPTH: "0"
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"
  script:
    - umask 022
    - apt-get update && apt-get install -y --no-install-recommends zip procps
    - python3 scripts/sync-surface-specs.py --refresh
    - python3 -m pip install 'pytest>=8,<10' 'jsonschema>=4,<5' 'cryptography>=43' 'python-docx>=1.2,<2' 'Pillow>=11,<13'
    - python3 -m pytest -q tests/test_install_bundle.py
    - git fetch --tags origin
    - python3 scripts/build-install-runtime.py --check
    - python3 scripts/build-legacy-catalog.py --check
    - >-
      python3 -m pytest -q
      tests/test_batman_contract.py::BatmanContractTests::test_batman_routing_fitness_remains_advisory_and_explicit_only
      tests/test_eval_pilot.py::test_static_pilot_validator_fails_when_a_protected_marker_disappears
      tests/test_public_docs_contract.py::test_readme_skill_count_matches_generated_manifest
      tests/test_intent_guide.py tests/test_intent_routing_resources.py tests/test_agy_intake.py tests/test_converge_numerical.py
      tests/test_uac_import.py::test_same_slug_descriptor_preserves_curated_metadata_when_quality_text_differs
      tests/test_uac_import.py::test_same_slug_descriptor_refreshes_bound_explicit_description
    - python3 -m pytest -q tests/test_capability_resources.py tests/test_manifest_stability.py tests/test_resource_delivery.py tests/test_resource_source_integrity.py tests/test_frontier_eval_integration.py tests/test_task_graph_check.py tests/test_trace_check.py tests/test_review_package.py tests/test_docs_recipe_resources.py tests/test_handoff_contracts.py tests/test_uac_assessment.py tests/test_uac_ssot.py tests/test_agent_execution_need.py tests/test_agent_approval_lifecycle.py tests/test_agent_surface_preservation.py tests/test_namespace_registration.py tests/test_uac_semantic_uplift.py tests/test_uac_quality.py tests/test_uac_source_integrity.py tests/test_uac_promotion_apply.py tests/test_supercharge_preservation.py tests/test_supercharge_debate.py tests/test_frontier_skill_contracts.py tests/test_resource_backed_skill_surfaces.py
    - python3 -m pytest -q tests/test_shaping_runtime.py tests/test_shaping_review_evidence.py tests/test_shaping_handover_outputs.py tests/test_shaping_loop.py tests/test_shaping_policy_recovery.py tests/test_shaping_repository_fit.py tests/test_shaping_progress.py tests/test_shaping_progress_view.py tests/test_shaping_export.py tests/test_shaping_export_docx.py tests/test_shaping_presentation.py
    - python3 -m pytest -q tests/test_presentation_cache.py tests/test_presentation_exporter.py
    - python3 -m pytest -q tests/test_skill_job_map.py tests/test_uac_routing_fitness.py tests/test_route_only_battery.py
    - python3 -m pytest -q tests/test_uac_import.py -k 'bootstrap or writes_ssot_and_descriptor_in_workspace_copy'
    - python3 scripts/smoke-clis.py
    - bin/capability-eval compile --all --check
    - bin/capability-eval calibrate --static-only
    - python3 scripts/validate-surfaces.py --strict
    - bin/capability-fabric build
    - python3 -m pytest -q tests/test_package_surfaces.py tests/test_package_local_config.py tests/test_deploy_profile.py tests/test_update_core_prompts.py tests/test_deploy_surfaces.py tests/test_agent_retirement.py tests/test_install_catalog.py tests/test_route_intent_migration.py tests/test_install_transaction.py tests/test_missing_recovery.py tests/test_install_capsule.py tests/test_installation.py tests/test_installation_history.py tests/test_install_bootstrap.py tests/test_program_adoption.py
